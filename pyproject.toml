[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-project-structure-101"
version = "0.1.0"
description = "Data engineering project structure example"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "schedule",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
